name: Bug
description: Something doesn't install, doesn't uninstall cleanly, or is broken.
labels: [bug]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, Cursor, Other MCP client]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool (if it's about one tool)
      placeholder: e.g. example-tool
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The exact command(s), and your agent's version.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
