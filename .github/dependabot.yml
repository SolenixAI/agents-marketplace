version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @types/node must stay on the Node 24 major: the runtime, engines and CI are all Node 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
