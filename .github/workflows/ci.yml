name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worlds:
    name: worlds follow the specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: every world skill follows the Agent Skills spec; worlds.json is consistent
        run: node scripts/check.ts

      - name: the skills CLI finds every world skill
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          out="$(npx -y skills@1.7.1 add . --list 2>&1)"
          for d in skills/*/; do n="$(basename "$d")"; grep -q "$n" <<<"$out" || { echo "::error::npx skills does not find $n"; exit 1; }; done

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
