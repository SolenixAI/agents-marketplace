name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: # run by hand on a branch whose pull_request run is missing; reads the title of its PR

permissions:
  pull-requests: read # read the PR title

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: check the PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: check the title of this branch's PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A dispatch run has no pull_request event, so the title comes from the PR on this branch.
          # The same rules as amannn/action-semantic-pull-request v6.1.1 with its defaults: a
          # conventional type, an optional (scope), an optional !, ": " and a subject.
          title="$(gh pr view "$BRANCH" --json title --jq .title)"
          echo "PR title: $title"
          pattern='^([[:alnum:]_]*)(\(.*\))?!?: (.+)$'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "::error::the PR title is not a Conventional Commit"
            exit 1
          fi
          case "${BASH_REMATCH[1]}" in
            feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert) echo "type ${BASH_REMATCH[1]} is allowed" ;;
            *) echo "::error::type \"${BASH_REMATCH[1]}\" is not a Conventional Commit type"; exit 1 ;;
          esac
