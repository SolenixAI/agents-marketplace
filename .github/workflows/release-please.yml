name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR and GitHub Release
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN permissions. release-please acts only with the solenix-hq app token. A PR opened with
    # GITHUB_TOKEN waits for approval before its pull_request checks run, so its required checks stay expected.
    permissions: {}
    steps:
      - name: Mint the solenix-hq app token, scoped to this repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SOLENIX_HQ_APP_ID }}
          private-key: ${{ secrets.SOLENIX_HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # tags, releases, CHANGELOG, release branch
          permission-issues: write # release labels
          permission-pull-requests: write # release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
