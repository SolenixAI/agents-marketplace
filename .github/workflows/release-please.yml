name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR and GitHub Release
    runs-on: ubuntu-latest
    # release-please runs with GITHUB_TOKEN, so it needs no stored key. GitHub holds the pull_request runs of a PR it
    # opens or updates for approval (docs.github.com/actions/concepts/security/github_token). Whoever ships the release
    # starts them: "Approve workflows to run" in the merge box, or gh pr close N && gh pr reopen N. The merge box counts
    # those runs. Checks dispatched from a workflow do not count.
    permissions:
      contents: write # tag and publish releases, update CHANGELOG
      issues: write # release labels
      pull-requests: write # open and update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
